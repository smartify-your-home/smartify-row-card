name: Validate Smartify Row
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: row-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Frontend syntax
        run: node --check custom_components/smartify_energy_row/frontend/smartify-energy-row.js
      - name: Frontend regression tests
        run: node --test tests/*.test.cjs
      - name: Python syntax
        run: python -m compileall -q custom_components tests/test_repository.py
      - name: Integration metadata, translations and secret checks
        run: python -m unittest discover -s tests -p 'test_*.py' -v
